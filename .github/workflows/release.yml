name: Release

# Builds the two downloads of a release, tested:
# - The mod loader app: an installer for Windows and an AppImage for Linux.
# - The in-game toolbox, a ready-to-extract ZIP (ASI, configuration, Ultimate ASI Loader as dinput8.dll, a plain text
#   README and the licenses).
# A pushed "v*" tag also publishes them as a GitHub release, a manual run only uploads them as artifacts.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  # Ultimate ASI Loader, bundled as dinput8.dll (MIT), pinned and checksum verified
  UAL_VERSION: v9.7.4
  UAL_SHA256: e5860e7d9a1805267535b65749575b5e406cc6ea3325c7392189c578815045d1

jobs:
  # The version is defined in the "project()" call of CMakeLists.txt and repeated in the app's package.json
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read the version
        id: version
        run: |
          version=$(sed -nE 's/^project\(MDisk VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          app_version=$(node -p "require('./packages/modloader/package.json').version")

          if [ -z "$version" ]; then
              echo "::error::Couldn't read the version from CMakeLists.txt"
              exit 1
          fi

          if [ "$app_version" != "$version" ]; then
              echo "::error::packages/modloader/package.json is at $app_version, CMakeLists.txt at $version"
              exit 1
          fi

          if [[ "$GITHUB_REF" == refs/tags/* ]] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match the version $version"
              exit 1
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

  asi:
    needs: version
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The MSVC STL shipped with recent Visual Studio versions requires Clang >= 20
      - name: Install LLVM
        run: choco upgrade llvm --no-progress -y

      # MSVC STL, Windows SDK and Ninja for Clang targeting the MSVC ABI
      - name: Set up the MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The compiler path is passed explicitly so the freshly installed LLVM is used,
      # not an older Clang that may come first in PATH
      - name: Configure
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          & "C:\Program Files\LLVM\bin\clang++.exe" --version
          cmake --preset release -DCMAKE_CXX_COMPILER="C:/Program Files/LLVM/bin/clang++.exe"

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --test-dir build-release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          $zipName = "MDiskModLoader-${{ needs.version.outputs.value }}-asi.zip"
          New-Item -ItemType Directory -Force dist, dist/licenses, ual | Out-Null

          Invoke-WebRequest -Uri "https://github.com/ThirteenAG/Ultimate-ASI-Loader/releases/download/$env:UAL_VERSION/Ultimate-ASI-Loader-NoPDB_x64.zip" -OutFile ual/ual.zip
          $hash = (Get-FileHash ual/ual.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:UAL_SHA256) {
              throw "Ultimate ASI Loader checksum mismatch: $hash"
          }
          Expand-Archive ual/ual.zip -DestinationPath ual
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/ThirteenAG/Ultimate-ASI-Loader/$env:UAL_VERSION/license" -OutFile dist/licenses/UltimateASILoader.txt

          Copy-Item build-release/MDiskModLoader.asi, build-release/MDiskModLoader.ini, ual/dinput8.dll, package/README.txt dist/
          Copy-Item LICENSE dist/licenses/MDiskModLoader.txt

          # Libraries compiled into the ASI: Zydis and Zycore (MIT, notice required with binaries)
          # and SafetyHook (Boost 1.0, not required for binaries, included for completeness)
          Copy-Item build-release/_deps/zydis-src/LICENSE dist/licenses/Zydis.txt
          Copy-Item build-release/_deps/zydis-src/dependencies/zycore/LICENSE dist/licenses/Zycore.txt
          Copy-Item build-release/_deps/safetyhook-src/LICENSE dist/licenses/SafetyHook.txt

          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path dist/* -DestinationPath release/$zipName

      # GitHub always zips artifacts, uploading the folder (not the ZIP) keeps a single ZIP layer for a manual run,
      # the ZIP itself goes to the release
      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: MDiskModLoader-${{ needs.version.outputs.value }}-asi
          path: dist/

      - name: Upload the ZIP for the release
        uses: actions/upload-artifact@v4
        with:
          name: release-asi
          path: release/
          if-no-files-found: error

  app:
    needs: version
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash
        working-directory: packages/modloader

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: packages/modloader/yarn.lock

      - name: Install the dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn vitest run

      # Published by the job below, electron-builder would publish on its own when it sees a tag
      - name: Build the installer
        run: |
          yarn build
          yarn electron-builder --publish never

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: release-app-${{ runner.os }}
          path: |
            packages/modloader/dist/release/*.exe
            packages/modloader/dist/release/*.AppImage
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [asi, app]
    runs-on: ubuntu-latest

    steps:
      - name: Download the files of the release
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            To install mods, download the mod loader app: `MDiskModLoader-<version>-win-x64.exe` on Windows, or the
            `.AppImage` on Linux (Steam Deck). See the README for how to use it.

            `MDiskModLoader-<version>-asi.zip` is the in-game toolbox for mod makers, playing mods doesn't need it.
